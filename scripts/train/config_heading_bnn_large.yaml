# Config for Heading Error Angle Prediction (Bayesian Large)
data:
  train_path: "data/datasets/lidar_tracking_combined_pure_pursuit_n17607.npz"
  target_col: "heading_error"
  batch_size: 64
  num_workers: 0
  val_split: 0.1
  pin_memory: false
  prefetch_factor: 2
  use_cache: true # Load into memory

training:
  max_epochs: 300
  lr: 5e-4
  weight_decay: 1e-5
  bnn_beta: 1e-4
  early_stopping_patience: 1000
  lr_patience: 10
  auto_lr_find: false
  resume: false
  precision: "32"
  gradient_clip_val: 1.0
  profiler: null # Choices: null, "simple", "advanced", "pytorch"

model:
  arch_id: 13  # Bayesian large heading model
